# ── advance mode (guideline 09) ─────────────────────────────────────────────
mi.prompt.compose=Dưới đây là dữ liệu đã thu thập cho câu hỏi của khách hàng. Hãy tổng hợp thành một câu trả lời duy nhất, ngắn gọn, bằng tiếng Việt. Chỉ dùng những con số xuất hiện trong dữ liệu này; không tự thêm lãi suất, phí hay số tiền nào khác. Nếu dữ liệu không đủ để trả lời một phần nào, hãy nói rõ phần đó còn thiếu.
