# Follow-ups when a money instruction is missing its details — ask, never send the customer off to do it themselves.
mi.reply.deposit.askAmount=Bạn muốn gửi tiết kiệm bao nhiêu tiền, kỳ hạn mấy tháng (1, 3, 6 hoặc 12 tháng)? Mình sẽ chuẩn bị sổ để bạn xác nhận.
mi.reply.transfer.collect=Bạn cho mình biết ngân hàng nhận, số tài khoản nhận và số tiền chuyển nhé (hoặc tên người nhận đã lưu trong danh bạ). Mình sẽ chuẩn bị lệnh để bạn xác nhận.
mi.reply.transfer.collectMissing=Mình đã ghi nhận: {0}. Mình còn cần {1} nữa nhé.
