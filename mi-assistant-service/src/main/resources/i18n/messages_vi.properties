mi.reply.greeting=Chào bạn! MEE có thể giúp bạn chuyển tiền, xem số dư và chi tiêu, mở sổ tiết kiệm, ước tính khoản vay hay giải đáp mọi thắc mắc về ngân hàng và tài chính cá nhân. Bạn cần gì nào?
