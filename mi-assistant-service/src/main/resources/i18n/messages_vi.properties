mi.reply.toolDone=Mình đã kiểm tra xong thông tin cho bạn.
mi.reply.done=Xong rồi. Bạn nhận +{0} điểm M-First cho giao dịch này.
mi.reply.cancelled=Đã huỷ. Không có giao dịch nào được thực hiện.
mi.reply.clarify=Mình chưa hiểu rõ ý bạn. Bạn muốn chuyển tiền, mở sổ tiết kiệm hay xem chi tiêu?
mi.reply.noAnswer=Mình chưa có thông tin về việc này. Bạn thử hỏi theo cách khác, hoặc gọi tổng đài 1900 6083 để được hỗ trợ trực tiếp nhé.
mi.reply.noAnswer.loan=Mình chưa có thông tin này trong phần khoản vay. Mình có thể xem dư nợ, tính khoản trả góp hoặc ước tính trả trước cho bạn — hoặc gọi tổng đài 1900 6083 nếu bạn cần tư vấn chi tiết.
mi.reply.noAnswer.card=Mình chưa có thông tin này về thẻ. Mình có thể xem danh sách thẻ, sao kê, khoá hoặc mở khoá thẻ cho bạn — hoặc gọi tổng đài 1900 6083 nếu cần hỗ trợ thêm.
mi.reply.noAnswer.saving=Mình chưa có thông tin này về tiết kiệm. Mình có thể tra lãi suất, xem sổ tiết kiệm hoặc mục tiêu của bạn — hoặc gọi tổng đài 1900 6083 để được tư vấn.
mi.reply.noAnswer.payment=Mình chưa có thông tin này về chuyển tiền và hoá đơn. Mình có thể xem hoá đơn đến hạn hoặc chuẩn bị lệnh chuyển cho bạn — hoặc gọi tổng đài 1900 6083 nếu cần hỗ trợ.
mi.reply.chatPayDisabled=Mình chưa thể thực hiện giao dịch, nhưng có thể hướng dẫn bạn từng bước.
mi.reply.guardrail.offTopic=Mình chỉ hỗ trợ các câu hỏi về dịch vụ MSB.
mi.reply.doNotShareSecrets=Bạn đừng chia sẻ mật khẩu, mã PIN hay mã OTP với bất kỳ ai, kể cả Mi nhé.

# ── refusals (design §12.4) ──────────────────────────────────────────────────
mi.reply.refuse.laundering=Mình không thể hỗ trợ việc này. Nếu bạn cần tư vấn về giao dịch hợp lệ, mình sẵn sàng giúp.
mi.reply.refuse.structuring=Mình không thể hỗ trợ chia nhỏ giao dịch để tránh quy định báo cáo.
mi.reply.refuse.fraud=Mình không thể hỗ trợ nội dung liên quan đến lừa đảo.
mi.reply.refuse.securityBypass=Mình không thể giúp vượt qua các bước bảo mật. Nếu bạn gặp khó khăn khi xác thực, hãy gọi 1900 6083.
mi.reply.refuse.accountAccess=Mình chỉ có thể hỗ trợ tài khoản của chính bạn.
mi.reply.refuse.forgery=Mình không thể tạo tài liệu hoặc sao kê giả.
mi.reply.refuse.selfHarm=Mình rất tiếc khi bạn đang trải qua điều này. Bạn có thể gọi đường dây hỗ trợ 1900 6083 hoặc chia sẻ với người thân nhé.

