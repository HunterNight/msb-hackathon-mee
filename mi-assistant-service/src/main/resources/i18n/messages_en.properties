# ── refusals (design §12.4) ──────────────────────────────────────────────────
mi.reply.refuse.laundering=I can't help with that. If you need advice on a legitimate transaction, I'm happy to help.
mi.reply.refuse.structuring=I can't help with splitting transactions to avoid reporting rules.
mi.reply.refuse.fraud=I can't help with anything related to fraud.
mi.reply.refuse.securityBypass=I can't help bypass security steps. If you're stuck authenticating, please call 1900 6083.
mi.reply.refuse.accountAccess=I can only help with your own account.
mi.reply.refuse.forgery=I can't create fake documents or statements.
mi.reply.refuse.selfHarm=I'm sorry you're going through this. Please consider calling 1900 6083 or talking to someone you trust.

